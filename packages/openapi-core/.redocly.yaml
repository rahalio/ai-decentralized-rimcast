apis:
  identity:
    root: src/identity.yaml
  models:
    root: src/models.yaml
  capacity:
    root: src/capacity.yaml
  placements:
    root: src/placements.yaml
  telemetry:
    root: src/telemetry.yaml
  incidents:
    root: src/incidents.yaml
  governance:
    root: src/governance.yaml

extends:
  - recommended

rules:
  no-unused-components: off
  operation-4xx-response: warn
  info-license: off
  info-license-url: off
  tag-description: off
  operation-operationId: error
  no-invalid-media-type-examples: off

theme:
  openapi:
    generateCodeSamples:
      languages: []
