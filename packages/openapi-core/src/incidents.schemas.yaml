openapi: 3.1.0
info:
  title: Incidents schemas
  version: 0.1.0
paths: {}
components:
  schemas:
    IncidentPackId:
      type: string
      pattern: '^inc_[0-9a-z]{26}$'
    IncidentPack:
      type: object
      required: [id, siteId, windowStart, windowEnd, createdAt]
      properties:
        id: { $ref: '#/components/schemas/IncidentPackId' }
        siteId: { type: string }
        modelVersionId: { type: string }
        edgeNodeId: { type: string }
        placementIds:
          type: array
          items: { type: string }
        windowStart: { type: string, format: date-time }
        windowEnd: { type: string, format: date-time }
        exportUri: { type: string }
        createdAt: { type: string, format: date-time }
    IncidentPackCreate:
      type: object
      required: [siteId, windowStart, windowEnd]
      properties:
        siteId: { type: string }
        modelVersionId: { type: string }
        edgeNodeId: { type: string }
        windowStart: { type: string, format: date-time }
        windowEnd: { type: string, format: date-time }
    IncidentPackListData:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/IncidentPack' }
        nextCursor: { type: string }
    IncidentPackResponse:
      allOf:
        - $ref: ./common/envelopes.yaml#/components/schemas/DataEnvelope
        - type: object
          properties:
            data: { $ref: '#/components/schemas/IncidentPack' }
    IncidentPackListResponse:
      allOf:
        - $ref: ./common/envelopes.yaml#/components/schemas/PagedDataEnvelope
        - type: object
          properties:
            data: { $ref: '#/components/schemas/IncidentPackListData' }
