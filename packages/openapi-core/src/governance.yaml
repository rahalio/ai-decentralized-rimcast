openapi: 3.1.0
info:
  title: Governance API
  version: 0.1.0
  description: |
    Site freezes, safe mode, and egress/overflow policy (BR-3, BR-5, BR-11).
  x-domain: gov
  license:
    name: Proprietary
    url: https://rimcast.local/license
servers:
  - url: https://api.rimcast.local
security:
  - apiKey: []
tags:
  - name: Governance
    description: Freezes, safe mode, egress
paths:
  /v1/governance/site-freezes:
    get:
      operationId: listSiteFreezes
      tags: [Governance]
      summary: List site freezes
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/Cursor
        - $ref: ./common/parameters.yaml#/components/parameters/Limit
        - name: siteId
          in: query
          schema: { type: string }
      x-repository: SiteFreeze
      x-dynamodb:
        entityType: "SITEFREEZE"
        pkPatternTemplate: "SITEFREEZE#${id}"
        skPatternTemplate: "METADATA"
        pkPattern: "entity"
        usePkQuery: false
        createdAtField: "createdAt"
        updatedAtField: "updatedAt"
        softDeleteEnabled: false
        filterFields: ["siteId"]
      responses:
        '200':
          description: Freezes page
          content:
            application/json:
              schema:
                $ref: ./governance.schemas.yaml#/components/schemas/SiteFreezeListResponse
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
    post:
      operationId: freezeSitePlacements
      tags: [Governance]
      summary: Freeze placements for a site without deleting history
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./governance.schemas.yaml#/components/schemas/SiteFreezeCreate
      x-repository: SiteFreeze
      x-dynamodb:
        entityType: "SITEFREEZE"
        pkPatternTemplate: "SITEFREEZE#${id}"
        skPatternTemplate: "METADATA"
        pkPattern: "entity"
        usePkQuery: false
        createdAtField: "createdAt"
        updatedAtField: "updatedAt"
        softDeleteEnabled: false
      responses:
        '201':
          description: Freeze created
          content:
            application/json:
              schema:
                $ref: ./governance.schemas.yaml#/components/schemas/SiteFreezeResponse
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem

  /v1/governance/site-freezes/{freezeId}/unfreeze:
    parameters:
      - name: freezeId
        in: path
        required: true
        schema:
          $ref: ./governance.schemas.yaml#/components/schemas/SiteFreezeId
    post:
      operationId: unfreezeSitePlacements
      tags: [Governance]
      summary: Lift a site freeze
      x-repository: SiteFreeze
      responses:
        '200':
          description: Freeze lifted
          content:
            application/json:
              schema:
                $ref: ./governance.schemas.yaml#/components/schemas/SiteFreezeResponse
        '404':
          $ref: ./common/responses.yaml#/components/responses/NotFound
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem

  /v1/governance/safe-mode:
    get:
      operationId: listSafeModeEvents
      tags: [Governance]
      summary: List safe-mode events
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/Cursor
        - $ref: ./common/parameters.yaml#/components/parameters/Limit
        - name: siteId
          in: query
          schema: { type: string }
      x-repository: SafeModeEvent
      x-dynamodb:
        entityType: "SAFEMODEEVENT"
        pkPatternTemplate: "SAFEMODEEVENT#${id}"
        skPatternTemplate: "METADATA"
        pkPattern: "entity"
        usePkQuery: false
        createdAtField: "createdAt"
        updatedAtField: "updatedAt"
        softDeleteEnabled: false
        filterFields: ["siteId"]
      responses:
        '200':
          description: Events page
          content:
            application/json:
              schema:
                $ref: ./governance.schemas.yaml#/components/schemas/SafeModeEventListResponse
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
    post:
      operationId: enterSafeMode
      tags: [Governance]
      summary: Enter documented safe mode (never silent slow cloud)
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./governance.schemas.yaml#/components/schemas/SafeModeEnter
      x-repository: SafeModeEvent
      x-dynamodb:
        entityType: "SAFEMODEEVENT"
        pkPatternTemplate: "SAFEMODEEVENT#${id}"
        skPatternTemplate: "METADATA"
        pkPattern: "entity"
        usePkQuery: false
        createdAtField: "createdAt"
        updatedAtField: "updatedAt"
        softDeleteEnabled: false
      responses:
        '201':
          description: Safe mode entered
          content:
            application/json:
              schema:
                $ref: ./governance.schemas.yaml#/components/schemas/SafeModeEventResponse
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem

  /v1/governance/safe-mode/{eventId}/clear:
    parameters:
      - name: eventId
        in: path
        required: true
        schema:
          $ref: ./governance.schemas.yaml#/components/schemas/SafeModeEventId
    post:
      operationId: clearSafeMode
      tags: [Governance]
      summary: Clear safe mode after review
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: ./governance.schemas.yaml#/components/schemas/SafeModeClear
      x-repository: SafeModeEvent
      responses:
        '200':
          description: Safe mode cleared
          content:
            application/json:
              schema:
                $ref: ./governance.schemas.yaml#/components/schemas/SafeModeEventResponse
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem

  /v1/governance/egress-policies:
    put:
      operationId: upsertEgressPolicy
      tags: [Governance]
      summary: Upsert site egress / overflow policy
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./governance.schemas.yaml#/components/schemas/EgressPolicyUpsert
      x-repository: EgressPolicy
      x-dynamodb:
        entityType: "EGRESSPOLICY"
        pkPatternTemplate: "EGRESSPOLICY#${id}"
        skPatternTemplate: "METADATA"
        pkPattern: "entity"
        usePkQuery: false
        createdAtField: "updatedAt"
        updatedAtField: "updatedAt"
        softDeleteEnabled: false
      responses:
        '200':
          description: Policy upserted
          content:
            application/json:
              schema:
                $ref: ./governance.schemas.yaml#/components/schemas/EgressPolicyResponse
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem

  /v1/governance/overflow-exceptions:
    get:
      operationId: listOverflowExceptions
      tags: [Governance]
      summary: List overflow exceptions
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/Cursor
        - $ref: ./common/parameters.yaml#/components/parameters/Limit
        - name: siteId
          in: query
          schema: { type: string }
      x-repository: OverflowException
      x-dynamodb:
        entityType: "OVERFLOWEXCEPTION"
        pkPatternTemplate: "OVERFLOWEXCEPTION#${id}"
        skPatternTemplate: "METADATA"
        pkPattern: "entity"
        usePkQuery: false
        createdAtField: "createdAt"
        updatedAtField: "updatedAt"
        softDeleteEnabled: false
        filterFields: ["siteId"]
      responses:
        '200':
          description: Exceptions page
          content:
            application/json:
              schema:
                $ref: ./governance.schemas.yaml#/components/schemas/OverflowExceptionListResponse
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
    post:
      operationId: requestOverflowException
      tags: [Governance]
      summary: Request purpose-tagged non-real-time overflow
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./governance.schemas.yaml#/components/schemas/OverflowExceptionCreate
      x-repository: OverflowException
      x-dynamodb:
        entityType: "OVERFLOWEXCEPTION"
        pkPatternTemplate: "OVERFLOWEXCEPTION#${id}"
        skPatternTemplate: "METADATA"
        pkPattern: "entity"
        usePkQuery: false
        createdAtField: "createdAt"
        updatedAtField: "updatedAt"
        softDeleteEnabled: false
      responses:
        '201':
          description: Exception requested
          content:
            application/json:
              schema:
                $ref: ./governance.schemas.yaml#/components/schemas/OverflowExceptionResponse
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem

components:
  securitySchemes:
    apiKey:
      $ref: ./common/security.yaml#/components/securitySchemes/apiKey
