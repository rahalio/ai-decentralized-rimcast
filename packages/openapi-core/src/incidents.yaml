openapi: 3.1.0
info:
  title: Incidents API
  version: 0.1.0
  description: |
    Incident evidence packs — model version × edge node × time window (BR-9).
  x-domain: inc
  license:
    name: Proprietary
    url: https://rimcast.local/license
servers:
  - url: https://api.rimcast.local
security:
  - apiKey: []
tags:
  - name: Incidents
    description: Incident packs
paths:
  /v1/incidents:
    get:
      operationId: listIncidentPacks
      tags: [Incidents]
      summary: List incident packs
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/Cursor
        - $ref: ./common/parameters.yaml#/components/parameters/Limit
        - name: siteId
          in: query
          schema: { type: string }
      x-repository: IncidentPack
      x-dynamodb:
        entityType: "INCIDENTPACK"
        pkPatternTemplate: "INCIDENTPACK#${id}"
        skPatternTemplate: "METADATA"
        pkPattern: "entity"
        usePkQuery: false
        createdAtField: "createdAt"
        updatedAtField: "createdAt"
        softDeleteEnabled: false
        filterFields: ["siteId"]
      responses:
        '200':
          description: Packs page
          content:
            application/json:
              schema:
                $ref: ./incidents.schemas.yaml#/components/schemas/IncidentPackListResponse
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
    post:
      operationId: createIncidentPack
      tags: [Incidents]
      summary: Generate incident pack for a window
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./incidents.schemas.yaml#/components/schemas/IncidentPackCreate
      x-repository: IncidentPack
      x-dynamodb:
        entityType: "INCIDENTPACK"
        pkPatternTemplate: "INCIDENTPACK#${id}"
        skPatternTemplate: "METADATA"
        pkPattern: "entity"
        usePkQuery: false
        createdAtField: "createdAt"
        updatedAtField: "createdAt"
        softDeleteEnabled: false
      responses:
        '201':
          description: Pack created
          content:
            application/json:
              schema:
                $ref: ./incidents.schemas.yaml#/components/schemas/IncidentPackResponse
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem

  /v1/incidents/{incidentId}:
    parameters:
      - name: incidentId
        in: path
        required: true
        schema:
          $ref: ./incidents.schemas.yaml#/components/schemas/IncidentPackId
    get:
      operationId: getIncidentPack
      tags: [Incidents]
      summary: Get incident pack
      x-repository: IncidentPack
      x-dynamodb:
        entityType: "INCIDENTPACK"
        pkPatternTemplate: "INCIDENTPACK#${incidentId}"
        skPatternTemplate: "METADATA"
        pkPattern: "entity"
        usePkQuery: false
        createdAtField: "createdAt"
        updatedAtField: "createdAt"
        softDeleteEnabled: false
      responses:
        '200':
          description: Pack
          content:
            application/json:
              schema:
                $ref: ./incidents.schemas.yaml#/components/schemas/IncidentPackResponse
        '404':
          $ref: ./common/responses.yaml#/components/responses/NotFound
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem

components:
  securitySchemes:
    apiKey:
      $ref: ./common/security.yaml#/components/securitySchemes/apiKey
